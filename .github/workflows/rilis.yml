# Push tag versi (mis. v1.0.0) -> GitHub membuat Release berisi:
#   ArsipPenugasan-v1.0.0.exe         exe satu berkas (tidak perlu Python)
#   ArsipPenugasan-python-v1.0.0.zip  kode sumber + skrip pasang, untuk PC yang memblokir exe
#   SHA256SUMS.txt                    sidik jari untuk memeriksa unduhan
name: Rilis

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  rilis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang pustaka
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tes
        run: python -m unittest test_core test_lain

      - name: Cek VERSI di core.py sama dengan tag
        shell: pwsh
        run: |
          $v = python -c "import core; print(core.VERSI)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "VERSI di core.py ($v) tidak sama dengan tag ${{ github.ref_name }}" }

      - name: Build exe
        run: >-
          python -m PyInstaller --noconfirm --onefile --windowed --name ArsipPenugasan
          --icon ikon.ico --add-data "ikon.ico;." --collect-all tkinterdnd2 arsip_penugasan.pyw

      - name: Siapkan berkas rilis
        shell: pwsh
        run: |
          $t = "${{ github.ref_name }}"
          Move-Item dist/ArsipPenugasan.exe "ArsipPenugasan-$t.exe"
          git archive --format=zip --prefix=arsip-penugasan/ -o "ArsipPenugasan-python-$t.zip" HEAD
          Get-FileHash "ArsipPenugasan-$t.exe", "ArsipPenugasan-python-$t.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File SHA256SUMS.txt -Encoding ascii

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ArsipPenugasan-${{ github.ref_name }}.exe
            ArsipPenugasan-python-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          generate_release_notes: true
